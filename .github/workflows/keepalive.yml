name: Keep bot awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the bot server
        run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 https://cinemavault-bot.onrender.com/ || true
